version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: anag
      POSTGRES_PASSWORD: anag
      POSTGRES_DB: anagnosis
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://anag:anag@postgres:5432/anagnosis
      SECRET_KEY: change-me-in-prod
      DEV_EMAILS: duncan.w.yu@gmail.com
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      # Web may not need DB; included for completeness
      DATABASE_URL: postgresql+psycopg2://anag:anag@postgres:5432/anagnosis
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:

