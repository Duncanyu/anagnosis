name: Deploy Azure Functions

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - app_name: rag-api-func
            package_path: api
            secret_name: AZURE_API_PUBLISH_PROFILE
          - app_name: rag-rerank-func
            package_path: rerank
            secret_name: AZURE_WORKER_PUBLISH_PROFILE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Deploy ${{ matrix.app_name }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ matrix.app_name }}
          package: ${{ matrix.package_path }}
          publish-profile: ${{ secrets[matrix.secret_name] }}
