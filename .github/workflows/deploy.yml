name: Deploy Azure Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - app_name: rag-api-func
            package_path: api
            secret_name: AZURE_API_PUBLISH_PROFILE
          - app_name: rag-rerank-func
            package_path: rerank
            secret_name: AZURE_WORKER_PUBLISH_PROFILE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Fails fast if the publish profile can't auth to Kudu
      - name: Preflight Kudu auth (${{ matrix.app_name }})
        env:
          PUBLISH_PROFILE: ${{ secrets[matrix.secret_name] }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, base64, urllib.request, sys
          xml = os.environ.get('PUBLISH_PROFILE','').strip()
          if len(xml) < 50:
              print("Publish profile missing/empty. Check repo secret:", flush=True)
              sys.exit(1)

          # Pick the ZipDeploy profile block (most reliable for CI)
          m = re.search(r'(<publishProfile[^>]*publishMethod="ZipDeploy"[^>]*/>)', xml)
          tag = m.group(1) if m else xml  # fall back to the whole xml

          def attr(name):
              m = re.search(fr'{name}="([^"]+)"', tag)
              return m.group(1) if m else None

          user = attr('userName')
          pwd  = attr('userPWD')
          scm  = attr('scmUri')
          publish_url = attr('publishUrl')

          if not scm:
              # Derive from publishUrl like "rag-api-func.scm.azurewebsites.net:443"
              if not publish_url:
                  print("No scmUri/publishUrl in profile. Is this the right secret/XML?", flush=True)
                  sys.exit(1)
              host = publish_url.split(':')[0]
              scm = f'https://{host}'

          if not (user and pwd):
              print("Username/password missing in profile (are they REDACTED?). Reset & re-download the profile.", flush=True)
              sys.exit(1)

          auth = base64.b64encode(f"{user}:{pwd}".encode()).decode()
          req = urllib.request.Request(scm.rstrip('/') + '/api/settings',
                                      headers={'Authorization': f'Basic {auth}'})
          with urllib.request.urlopen(req) as r:
              print("Kudu preflight HTTP", r.status)
              sys.exit(0 if r.status == 200 else 1)
          PY
