name: Deploy Azure Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - app_name: rag-api-func
            package_path: api
            secret_name: AZURE_API_PUBLISH_PROFILE
          - app_name: rag-rerank-func
            package_path: rerank
            secret_name: AZURE_WORKER_PUBLISH_PROFILE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Fails fast if the publish profile can't auth to Kudu
      - name: Preflight Kudu auth (${{ matrix.app_name }})
        env:
          PUBLISH_PROFILE: ${{ secrets[matrix.secret_name] }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, base64, urllib.request, sys
          xml = os.environ['PUBLISH_PROFILE']
          scm = re.search(r'scmUri="([^"]+)"', xml).group(1).rstrip('/')
          user = re.search(r'userName="([^"]+)"', xml).group(1)
          pwd  = re.search(r'userPWD="([^"]+)"', xml).group(1)
          auth = base64.b64encode(f"{user}:{pwd}".encode()).decode()
          req = urllib.request.Request(scm + '/api/settings', headers={'Authorization': f'Basic {auth}'})
          with urllib.request.urlopen(req) as r:
              print("Kudu preflight HTTP", r.status)
              sys.exit(0 if r.status == 200 else 1)
          PY

      - name: Deploy ${{ matrix.app_name }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ matrix.app_name }}
          package: ${{ matrix.package_path }}
          publish-profile: ${{ secrets[matrix.secret_name] }}