server {
    listen 80;
    server_name _;

    # Increase proxy buffer sizes for large JSON payloads
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;
    client_max_body_size 128m;
    keepalive_timeout 5s;

    # Baseline security headers (TLS/HSTS should be enabled when terminating HTTPS)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # If you terminate TLS here, consider enabling HSTS after verification:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_pass http://api:8000/;
    }

    location /static/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://web:7860/static/;
    }

    location /assets/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://web:7860/assets/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_pass http://web:7860/;
    }
}
