server {
    listen 80;
    server_name _;

    # Increase proxy buffer sizes for large JSON payloads
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000/;
    }

    location /static/ {
        proxy_set_header Host $host;
        proxy_pass http://web:7860/static/;
    }

    location /assets/ {
        proxy_set_header Host $host;
        proxy_pass http://web:7860/assets/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:7860/;
    }
}

